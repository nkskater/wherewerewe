repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  # Use the ruff pinned in backend/uv.lock so pre-commit and CI always agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
