[project]
name = "wherewerewe"
version = "0.2.0"
description = "Spoiler-safe 'Previously on...' recaps for TV shows, based on what each viewer has actually watched."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pysubs2>=1.7",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
wherewerewe = "wherewerewe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wherewerewe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: spoiler eval suite; needs a live LLM (set EVAL_LLM_BASE_URL and EVAL_LLM_MODEL)",
    "ffmpeg: needs ffmpeg and ffprobe on PATH",
]
addopts = "-m 'not eval'"
