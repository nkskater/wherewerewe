{% extends "base.html" %}
{% block title %}Characters · Where Were We{% endblock %}
{% block page %}characters{% endblock %}
{% block content %}
<section class="page-head" data-show-id="{{ show_id }}">
  <div>
    <h1 id="chars-title">Characters</h1>
    <p class="muted" id="chars-asof"></p>
  </div>
</section>
<input type="search" id="chars-search" class="search" placeholder="Search by name…" autocomplete="off">
<p class="muted" id="chars-status">Loading…</p>
<div class="char-list" id="char-list"></div>
<template id="char-card">
  <article class="card char">
    <div class="char-head">
      <h2 class="char-name"></h2>
      <span class="char-seen muted"></span>
    </div>
    <p class="char-aliases muted"></p>
    <p class="char-role"></p>
    <p class="char-status"></p>
    <details class="char-history"><summary>Episode notes</summary><ul></ul></details>
    <div class="actions">
      <button class="btn ghost ask-btn">Who is this again?</button>
    </div>
    <p class="char-answer" hidden></p>
  </article>
</template>
{% endblock %}
