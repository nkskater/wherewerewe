{% extends "base.html" %}
{% block title %}Characters · Where Were We{% endblock %}
{% block page %}characters{% endblock %}
{% block content %}
<div class="page-title" data-show-id="{{ show_id }}">
  <div>
    <p class="kicker" id="chars-show">&nbsp;</p>
    <h1>Who's who</h1>
    <p class="subtle" id="chars-asof"></p>
  </div>
</div>
<input type="search" id="chars-search" class="search" placeholder="Find a character" autocomplete="off">
<p class="empty" id="chars-status">Loading…</p>
<ul class="people" id="char-list"></ul>
<template id="char-card">
  <li class="person">
    <div class="person-head">
      <h2 class="person-name"></h2>
      <span class="code person-seen"></span>
    </div>
    <p class="person-aka"></p>
    <p class="person-role"></p>
    <p class="person-status"></p>
    <details class="person-history"><summary>Episode notes</summary><ol></ol></details>
    <button class="link ask-btn" type="button">Remind me who this is</button>
    <p class="person-answer" hidden></p>
  </li>
</template>
{% endblock %}
