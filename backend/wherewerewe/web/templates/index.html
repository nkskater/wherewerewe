{% extends "base.html" %}
{% block page %}home{% endblock %}
{% block toolbar %}
<div class="tb-group">
  <button class="tb-btn" id="sync-btn" type="button"><svg class="icon"><use href="#i-refresh"/></svg><span>Sync</span></button>
</div>
<div class="tb-group tb-right">
  <div class="tb-menu" data-menu="length">
    <button class="tb-btn" type="button"><svg class="icon"><use href="#i-text"/></svg><span>Recap length</span></button>
    <ul class="menu" hidden>
      <li><button data-value="quick">Quick</button></li>
      <li><button data-value="standard">Standard</button></li>
      <li><button data-value="deep">Deep</button></li>
    </ul>
  </div>
  <div class="tb-menu" data-menu="view">
    <button class="tb-btn" type="button"><svg class="icon"><use href="#i-grid"/></svg><span>View</span></button>
    <ul class="menu" hidden>
      <li><button data-value="posters">Posters</button></li>
      <li><button data-value="table">Table</button></li>
    </ul>
  </div>
  <div class="tb-menu" data-menu="sort">
    <button class="tb-btn" type="button"><svg class="icon"><use href="#i-sort"/></svg><span>Sort</span></button>
    <ul class="menu" hidden>
      <li><button data-value="recent">Last watched</button></li>
      <li><button data-value="away">Days away</button></li>
      <li><button data-value="title">Title</button></li>
    </ul>
  </div>
</div>
{% endblock %}
{% block content %}
<p class="empty" id="home-status">Loading…</p>
<div class="posters" id="show-posters" hidden></div>
<table class="table" id="show-table" hidden>
  <thead><tr>
    <th class="col-status"></th><th>Show</th><th>Last watched</th><th>Up next</th>
    <th class="num">Away</th><th class="col-progress">Episodes</th><th class="col-actions"></th>
  </tr></thead>
  <tbody></tbody>
</table>
{% endblock %}
