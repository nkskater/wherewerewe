<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Sign in · Where Were We</title>
  <script>
    try {
      var t = localStorage.getItem("www.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body data-page="login" class="login-body">
  <main class="login-card" data-next="{{ next }}">
    <div class="login-logo"><img src="/static/icon.svg" alt="" width="40" height="40"><span>Where Were We</span></div>
    {% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}
    {% if plex %}
    <button class="btn btn-plex" id="plex-btn" type="button">Sign in with Plex</button>
    <p class="login-or"><span>or</span></p>
    {% endif %}
    <form id="password-form">
      <label class="login-label" for="password">Admin password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="login-msg" id="login-msg" role="alert"></p>
    </form>
  </main>
  <script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
