{% extends "base.html" %}
{% block title %}Recap · Where Were We{% endblock %}
{% block page %}recap{% endblock %}
{% block content %}
<article class="recap" data-recap-id="{{ recap_id }}">
  <header class="recap-head">
    <p class="kicker">Previously on</p>
    <h1 id="recap-show">&nbsp;</h1>
    <p class="recap-through" id="recap-boundary"></p>
  </header>
  <div class="recap-bar">
    <div class="tabs" id="recap-length" role="radiogroup" aria-label="Recap length">
      <button data-length="quick" role="radio">Quick</button>
      <button data-length="standard" role="radio">Standard</button>
      <button data-length="deep" role="radio">Deep</button>
    </div>
    <div class="recap-links">
      <button class="link" id="listen-btn" type="button" hidden>Read aloud</button>
      <a class="link" id="chars-btn">Characters</a>
    </div>
  </div>
  <p class="status" id="recap-status"><span class="status-dot"></span><span class="status-text">Waiting…</span></p>
  <div class="recap-text" id="recap-text" aria-live="polite"></div>
  <aside class="note note-warn" id="recap-coverage" hidden></aside>
  <details class="footnote" id="recap-verification" hidden>
    <summary></summary>
    <ol></ol>
  </details>
  <p class="note note-error" id="recap-error" hidden></p>
</article>
{% endblock %}
