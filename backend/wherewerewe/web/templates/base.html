<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Where Were We{% endblock %}</title>
  <script>
    try {
      var t = localStorage.getItem("www.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="masthead">
    <a class="wordmark" href="/">Where Were&nbsp;We</a>
    <nav class="nav" aria-label="Main">
      <a href="/" {% if path == '/' %}aria-current="page"{% endif %}>Watching</a>
      <a href="/indexing" {% if path == '/indexing' %}aria-current="page"{% endif %}>Library</a>
      <a href="/settings" {% if path == '/settings' %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <div class="masthead-tools">
      <label class="viewer">
        <span class="viewer-label">Viewer</span>
        <select id="user-select"></select>
      </label>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Color theme">Auto</button>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">v{{ version }}</footer>
  <script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
